<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walls Pro</title>
<style>
:root{--ac:#2f80ff;--bg:#07122b;--card:#0f2147;--tx:#eaf2ff;--mu:#8ea6cf;--cols:2}
[data-t=dark]{--bg:#0f0f14;--card:#1a1a22;--tx:#f2f2f7;--mu:#8b8b99}
[data-t=light]{--bg:#f3f6fc;--card:#fff;--tx:#12203a;--mu:#64748b}
[data-t=amoled]{--bg:#000;--card:#0e0e0e;--tx:#f2f2f7;--mu:#8b8b99}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;font-size:22px;font-weight:800;letter-spacing:.3px}
header span{color:var(--ac)}
#main{flex:1;overflow-y:auto;padding:0 12px 16px}
nav{display:flex;background:var(--card);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid #8884}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px;font-size:12px;border-radius:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac)}
.sb{display:flex;gap:8px;margin:6px 0 10px}
input{flex:1;background:var(--card);color:var(--tx);border:1px solid #8884;border-radius:14px;padding:13px 14px;font-size:15px;outline:none;width:100%}
input:focus{border-color:var(--ac)}
button{font-family:inherit}
.sb button,.pri{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600}
.sb .ghost{background:var(--card);color:var(--tx);border:1px solid #8884;white-space:nowrap}
.chips,.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.row{flex-wrap:wrap;padding:8px 0 2px}
.chip{white-space:nowrap;background:var(--card);padding:9px 14px;border-radius:20px;font-size:14px;border:1px solid transparent}
.chip.on{background:var(--ac);color:#fff}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid #8886}
.sw{width:38px;height:38px;border-radius:50%;display:inline-block;border:3px solid transparent}
.sw.on{border-color:var(--tx)}
.g{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px}
.g img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:var(--card);animation:fi .4s}
@keyframes fi{from{opacity:0;transform:scale(.97)}to{opacity:1}}
.more{display:block;margin:16px auto;background:var(--card);color:var(--tx);border:1px solid #8884;border-radius:14px;padding:12px 26px;font-size:15px}
.st{text-align:center;color:var(--mu);font-size:14px;padding:10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.card h3{font-size:15px;margin-bottom:6px}
.card input{margin:8px 0}
.mu{color:var(--mu);font-size:13px;margin-top:6px;line-height:1.5}
h2{margin:6px 0 10px}
.h3{font-size:15px;font-weight:700;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.h3 span{font-size:13px;font-weight:400;color:var(--ac)}
#v{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
#vi{flex:1;min-height:0;width:100%;object-fit:contain}
#vinfo{text-align:center;color:#9db4e0;font-size:12px;padding:6px}
#vt{text-align:center;color:#9f9;font-size:13px;min-height:20px;padding:2px}
.vb{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 14px)}
.vb button{background:#1b2540;color:#fff;border:0;border-radius:14px;padding:14px;font-size:18px;flex:0 0 54px}
.vb .pri{flex:1;font-size:16px;background:var(--ac)}
#fs{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:30}
#fs>div{background:var(--card);width:100%;max-height:82%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#fs .btns{display:flex;gap:8px;margin-top:16px}
#fs .btns button{flex:1}
#fs .btns .ghost2{background:var(--bg);color:var(--tx);border:1px solid #8884;border-radius:14px;padding:12px;font-size:15px}
#sp{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .5s}
#sp h1{font-size:34px;font-weight:800}#sp h1 span{color:var(--ac)}
#sp p{color:var(--mu);margin-top:8px}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2540;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none;max-width:90%}
</style>
</head>
<body>
<div id="sp"><h1>Walls<span>Pro</span></h1><p id="sptx"></p></div>
<div id="app">
  <header>Walls<span>Pro</span></header>
  <div id="main"></div>
  <nav id="nav"></nav>
</div>
<div id="v">
  <img id="vi"><div id="vinfo"></div><div id="vt"></div>
  <div class="vb">
    <button id="vf">♡</button>
    <button id="vd" class="pri"></button>
    <button id="vs">↗</button>
    <button id="vx">✕</button>
  </div>
</div>
<div id="fs"><div id="fp"></div></div>
<div id="tt"></div>

<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n||0);

const L={
en:{tag:'Beautiful wallpapers, free',home:'Home',fav:'Favorites',set:'Settings',search:'Search wallpapers...',all:'✨ All',more:'Show more',loading:'Loading...',none:'Nothing found',needkey:'First add your free Pixabay API key in <b>Settings</b>.',err:'❌ Could not load. Check your internet or API key.',nofav:'No favorites yet.<br>Open a wallpaper and tap ♡.',filters:'Filters',sort:'Sort by',popular:'Popular',latest:'Latest',size:'Minimum size',color:'Color',anyc:'Any color',apply:'Apply',reset:'Reset',recent:'Recently viewed',clear:'Clear',theme:'Theme',accent:'Accent color',cols:'Grid columns',lang:'Language',key:'Pixabay API key',paste:'Paste your key here',save:'Save',keyhelp:'Create a free account on pixabay.com. Your key is shown on the API documentation page.',clearfav:'Clear favorites',clearhist:'Clear search history',credit:'Photos: Pixabay (Pixabay License, free to use)',dl:'⬇ Download',dling:'Downloading...',saved:'✅ Saved: Documents/Wallpapers',dled:'✅ Downloaded',dlfail:'❌ Could not save. Tap ↗ and save from the browser.',keysaved:'✅ Key saved',favclr:'Favorites cleared',histclr:'History cleared',by:'by',ncol:'columns',th_blue:'🔵 Blue',th_dark:'🌙 Dark',th_light:'☀️ Light',th_amoled:'⚫ AMOLED',
 c:{red:'Red',orange:'Orange',yellow:'Yellow',green:'Green',turquoise:'Turquoise',blue:'Blue',lilac:'Lilac',pink:'Pink',white:'White',gray:'Gray',black:'Black',brown:'Brown'}},
hi:{tag:'बेहतरीन वॉलपेपर, मुफ़्त',home:'होम',fav:'पसंदीदा',set:'सेटिंग्स',search:'वॉलपेपर खोजें...',all:'✨ सब',more:'और दिखाएँ',loading:'लोड हो रहा है...',none:'कुछ नहीं मिला',needkey:'पहले <b>सेटिंग्स</b> में अपनी मुफ़्त Pixabay API key डालें।',err:'❌ लोड नहीं हुआ। इंटरनेट या API key जाँचें।',nofav:'अभी कोई पसंदीदा नहीं।<br>वॉलपेपर खोलकर ♡ दबाएँ।',filters:'फ़िल्टर',sort:'क्रम',popular:'लोकप्रिय',latest:'नए',size:'न्यूनतम साइज़',color:'रंग',anyc:'कोई भी रंग',apply:'लागू करें',reset:'रीसेट',recent:'हाल में देखे',clear:'साफ़ करें',theme:'थीम',accent:'एक्सेंट रंग',cols:'ग्रिड कॉलम',lang:'भाषा',key:'Pixabay API key',paste:'यहाँ key पेस्ट करें',save:'सेव करें',keyhelp:'pixabay.com पर मुफ़्त अकाउंट बनाएँ। API डॉक्यूमेंटेशन पेज पर आपकी key दिखती है।',clearfav:'पसंदीदा साफ़ करें',clearhist:'सर्च हिस्ट्री साफ़ करें',credit:'फ़ोटो: Pixabay (Pixabay लाइसेंस, मुफ़्त उपयोग)',dl:'⬇ डाउनलोड',dling:'डाउनलोड हो रहा है...',saved:'✅ सेव हुआ: Documents/Wallpapers',dled:'✅ डाउनलोड हो गया',dlfail:'❌ सेव नहीं हुआ। ↗ दबाकर ब्राउज़र से सेव करें।',keysaved:'✅ key सेव हो गई',favclr:'पसंदीदा साफ़ हो गए',histclr:'हिस्ट्री साफ़ हो गई',by:'फ़ोटोग्राफ़र',ncol:'कॉलम',th_blue:'🔵 ब्लू',th_dark:'🌙 डार्क',th_light:'☀️ लाइट',th_amoled:'⚫ AMOLED',
 c:{red:'लाल',orange:'नारंगी',yellow:'पीला',green:'हरा',turquoise:'फ़िरोज़ी',blue:'नीला',lilac:'बैंगनी',pink:'गुलाबी',white:'सफ़ेद',gray:'स्लेटी',black:'काला',brown:'भूरा'}}
};
const CATS=[["nature","🌿","Nature","प्रकृति"],["animals","🐾","Animals","जानवर"],["travel","✈️","Travel","यात्रा"],["buildings","🏙️","Buildings","इमारतें"],["backgrounds","🎨","Backgrounds","बैकग्राउंड"],["places","📍","Places","जगहें"],["science","🔬","Science","विज्ञान"],["food","🍕","Food","खाना"],["sports","⚽","Sports","खेल"],["music","🎵","Music","संगीत"]];
const COLORS={red:'#e53935',orange:'#fb8c00',yellow:'#fdd835',green:'#43a047',turquoise:'#1abc9c',blue:'#1e88e5',lilac:'#b39ddb',pink:'#ec407a',white:'#ffffff',gray:'#9e9e9e',black:'#000000',brown:'#795548'};
const SIZES=[[720,'HD'],[1080,'Full HD'],[1440,'2K']];
const ACC=["#2f80ff","#00b4ff","#7c5cff","#00c2a8","#ff5c8a","#ffb020"];
const THEMES=['blue','dark','light','amoled'];

const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={key:ls.get('key',''),theme:ls.get('theme','blue'),ac:ls.get('ac',ACC[0]),cols:ls.get('cols',2),lang:ls.get('lang','en'),
  sort:ls.get('sort','popular'),mw:ls.get('mw',720),color:ls.get('color',''),
  favs:ls.get('favs',[]),recent:ls.get('recent',[]),hist:ls.get('hist',[]),
  tab:'home',q:'',cat:'',page:1,items:[],busy:false,end:false,tok:0,list:[],i:0};
const T=k=>(L[S.lang]&&L[S.lang][k])||L.en[k]||k;

function apply(){
  document.documentElement.dataset.t=S.theme;
  const st=document.documentElement.style;
  st.setProperty('--ac',S.ac);st.setProperty('--cols',S.cols);
  $('#nav').innerHTML=`<button data-t="home"><b>🏠</b>${T('home')}</button><button data-t="fav"><b>♥</b>${T('fav')}</button><button data-t="set"><b>⚙️</b>${T('set')}</button>`;
  $('#vd').textContent=T('dl');
  const sp=$('#sptx');if(sp)sp.textContent=T('tag');
}
function toast(t){const e=$('#tt');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2200)}
function setSt(t){const e=$('#st');if(e)e.innerHTML=t}

/* ---------- screens ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  if(S.tab==='home')home();else if(S.tab==='fav')fav();else sett();
  $('#main').scrollTop=0;
}
const chip=(v,l)=>`<span class="chip ${S.cat===v?'on':''}" data-c="${v}">${l}</span>`;
const gridHTML=(a,s)=>a.map((x,i)=>`<img data-i="${i}" data-s="${s}" loading="lazy" src="${x.w}" alt="${esc(x.t||'')}">`).join('');
const catLabel=c=>c[1]+' '+(S.lang==='hi'?c[3]:c[2]);

function home(){
  const n=(S.sort!=='popular')+(S.mw!==720)+(S.color?1:0);
  $('#main').innerHTML=`<div class="sb"><input id="q" placeholder="${T('search')}" value="${esc(S.q)}"><button id="go">🔍</button><button id="fb" class="ghost">🎚️${n?' '+n:''}</button></div>
  ${S.hist.length?`<div class="chips">${S.hist.map(h=>`<span class="chip" data-h="${esc(h)}">🕘 ${esc(h)}</span>`).join('')}<span class="chip" data-hc="1">✕</span></div>`:''}
  <div class="chips">${chip('',T('all'))}${CATS.map(c=>chip(c[0],catLabel(c))).join('')}</div>
  <div id="g" class="g">${gridHTML(S.items,'home')}</div>
  <button id="more" class="more" style="display:${S.items.length&&!S.end?'block':'none'}">${T('more')}</button>
  <p id="st" class="st"></p>`;
  if(!S.items.length)load(true);
}
function fav(){
  let h=`<h2>♥ ${T('fav')}</h2>`;
  h+=S.favs.length?`<div class="g">${gridHTML(S.favs,'fav')}</div>`:`<p class="st">${T('nofav')}</p>`;
  if(S.recent.length)h+=`<div class="h3">${T('recent')}<span data-rc="1">${T('clear')}</span></div><div class="g">${gridHTML(S.recent,'rec')}</div>`;
  $('#main').innerHTML=h;
}
function sett(){
  $('#main').innerHTML=`<h2>${T('set')}</h2>
  <div class="card"><h3>${T('lang')}</h3><div class="row"><span class="chip ${S.lang==='en'?'on':''}" data-lg="en">English</span><span class="chip ${S.lang==='hi'?'on':''}" data-lg="hi">हिंदी</span></div></div>
  <div class="card"><h3>${T('theme')}</h3><div class="row">${THEMES.map(t=>`<span class="chip ${S.theme===t?'on':''}" data-th="${t}">${T('th_'+t)}</span>`).join('')}</div></div>
  <div class="card"><h3>${T('accent')}</h3><div class="row">${ACC.map(c=>`<i class="sw ${S.ac===c?'on':''}" data-ac="${c}" style="background:${c}"></i>`).join('')}</div></div>
  <div class="card"><h3>${T('cols')}</h3><div class="row">${[2,3].map(n=>`<span class="chip ${S.cols===n?'on':''}" data-co="${n}">${n} ${T('ncol')}</span>`).join('')}</div></div>
  <div class="card"><h3>${T('key')}</h3><input id="ky" value="${esc(S.key)}" placeholder="${T('paste')}"><button class="pri" id="sk">${T('save')}</button><p class="mu">${T('keyhelp')}</p></div>
  <div class="card"><button class="more" style="margin:0 0 10px" id="cf">${T('clearfav')}</button><button class="more" style="margin:0" id="ch">${T('clearhist')}</button></div>
  <p class="mu" style="text-align:center">${T('credit')}</p>`;
}

/* ---------- filter sheet ---------- */
function openF(){
  $('#fp').innerHTML=`<h2>🎚️ ${T('filters')}</h2>
  <div class="h3">${T('sort')}</div><div class="row">${[['popular',T('popular')],['latest',T('latest')]].map(o=>`<span class="chip ${S.sort===o[0]?'on':''}" data-so="${o[0]}">${o[1]}</span>`).join('')}</div>
  <div class="h3">${T('size')}</div><div class="row">${SIZES.map(o=>`<span class="chip ${S.mw===o[0]?'on':''}" data-mw="${o[0]}">${o[1]}</span>`).join('')}</div>
  <div class="h3">${T('color')}</div><div class="row"><span class="chip ${S.color===''?'on':''}" data-cl="none">${T('anyc')}</span>${Object.keys(COLORS).map(k=>`<span class="chip ${S.color===k?'on':''}" data-cl="${k}"><i class="dot" style="background:${COLORS[k]}"></i>${L[S.lang].c[k]}</span>`).join('')}</div>
  <div class="btns"><button class="ghost2" id="fr">${T('reset')}</button><button class="pri" id="fa">${T('apply')}</button></div>`;
  $('#fs').style.display='flex';
}
function closeF(){$('#fs').style.display='none'}

/* ---------- data ---------- */
async function load(reset){
  if(reset){S.tok++;S.busy=false}
  if(S.busy)return;
  if(!S.key){setSt(T('needkey'));return}
  if(reset){S.page=1;S.items=[];S.end=false;const g=$('#g');if(g)g.innerHTML='';const m=$('#more');if(m)m.style.display='none'}
  if(S.end)return;
  const tok=S.tok;S.busy=true;setSt(T('loading'));
  try{
    let u=`https://pixabay.com/api/?key=${encodeURIComponent(S.key)}&image_type=photo&orientation=vertical&min_width=${S.mw}&per_page=30&page=${S.page}&safesearch=true&order=${S.sort}`;
    if(S.q)u+=`&q=${encodeURIComponent(S.q)}`;
    if(S.cat)u+=`&category=${S.cat}`;
    if(S.color)u+=`&colors=${S.color}`;
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    if(tok!==S.tok)return;
    const n=d.hits.map(h=>({id:h.id,w:h.webformatURL,l:h.largeImageURL,t:h.tags,u:h.user,x:h.imageWidth,y:h.imageHeight,v:h.views,d:h.downloads}));
    S.items.push(...n);S.page++;
    if(!n.length||S.items.length>=d.totalHits)S.end=true;
    if(S.tab==='home'){
      const g=$('#g');if(g)g.innerHTML=gridHTML(S.items,'home');
      const m=$('#more');if(m)m.style.display=S.end?'none':'block';
    }
    setSt(S.items.length?'':T('none'));
  }catch(e){if(tok===S.tok)setSt(T('err'))}
  if(tok===S.tok)S.busy=false;
}
function doSearch(q){
  S.q=q;
  if(q){S.hist=[q,...S.hist.filter(x=>x!==q)].slice(0,8);ls.set('hist',S.hist)}
  home();load(true);
}

/* ---------- viewer ---------- */
const isFav=id=>S.favs.some(f=>f.id===id);
function openV(list,i){
  S.list=list;S.i=i;showV();$('#v').style.display='flex';
  const it=list[i];S.recent=[it,...S.recent.filter(r=>r.id!==it.id)].slice(0,20);ls.set('recent',S.recent);
}
function showV(){
  const it=S.list[S.i];$('#vi').src=it.l;$('#vt').textContent='';$('#vt').style.color='#9f9';
  $('#vinfo').textContent=it.x?`${it.x}×${it.y} · ${T('by')} ${it.u} · 👁 ${fmt(it.v)} · ⬇ ${fmt(it.d)}`:'';
  $('#vf').textContent=isFav(it.id)?'♥':'♡';$('#vf').style.color=isFav(it.id)?'#ff5c8a':'#fff';
}
function step(d){const n=S.i+d;if(n<0||n>=S.list.length)return;S.i=n;showV();
  if(S.list===S.items&&S.i>=S.items.length-4)load()}
let tx=0;
$('#vi').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#vi').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(dx>60)step(-1);else if(dx<-60)step(1)});
$('#vx').onclick=()=>{$('#v').style.display='none';$('#vi').src='';if(S.tab==='fav')fav()};
$('#vf').onclick=()=>{
  const it=S.list[S.i];
  S.favs=isFav(it.id)?S.favs.filter(f=>f.id!==it.id):[it,...S.favs];
  ls.set('favs',S.favs);showV();
};
$('#vs').onclick=()=>{const it=S.list[S.i];
  if(navigator.share)navigator.share({title:'Wallpaper',url:it.l}).catch(()=>{});else window.open(it.l,'_blank')};
$('#vd').onclick=async()=>{
  const it=S.list[S.i],m=$('#vt');m.style.color='#9f9';m.textContent=T('dling');
  try{
    const r=await fetch(it.l);const b=await r.blob();
    const FS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
    if(FS&&Capacitor.isNativePlatform()){
      const data=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(b)});
      await FS.writeFile({path:`Wallpapers/wallpaper_${it.id}.jpg`,data,directory:'DOCUMENTS',recursive:true});
      m.textContent=T('saved');
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`wallpaper_${it.id}.jpg`;a.click();
      m.textContent=T('dled');
    }
  }catch(e){m.style.color='#f99';m.textContent=T('dlfail')}
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.closest('nav button')){S.tab=t.closest('nav button').dataset.t;render();return}
  if(t.tagName==='IMG'&&d.i!==undefined&&d.s){openV(d.s==='fav'?S.favs:d.s==='rec'?S.recent:S.items,+d.i);return}
  if(t.id==='fs'){closeF();return}
  if(d.so){S.sort=d.so;openF();return}
  if(d.mw){S.mw=+d.mw;openF();return}
  if(d.cl){S.color=d.cl==='none'?'':d.cl;openF();return}
  if(t.id==='fr'){S.sort='popular';S.mw=720;S.color='';openF();return}
  if(t.id==='fa'){ls.set('sort',S.sort);ls.set('mw',S.mw);ls.set('color',S.color);closeF();home();load(true);return}
  if(t.id==='fb'){openF();return}
  if(d.hc){S.hist=[];ls.set('hist',[]);home();return}
  if(d.h!==undefined&&t.classList.contains('chip')){$('#main').scrollTop=0;doSearch(d.h);return}
  if(d.c!==undefined&&t.classList.contains('chip')){S.cat=d.c;home();load(true);return}
  if(t.id==='go'){doSearch($('#q').value.trim());return}
  if(t.id==='more'){load();return}
  if(d.rc){S.recent=[];ls.set('recent',[]);fav();return}
  if(d.lg){S.lang=d.lg;ls.set('lang',S.lang);apply();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));sett();return}
  if(d.th){S.theme=d.th;ls.set('theme',S.theme);apply();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));sett();return}
  if(d.ac){S.ac=d.ac;ls.set('ac',S.ac);apply();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));sett();return}
  if(d.co){S.cols=+d.co;ls.set('cols',S.cols);apply();sett();return}
  if(t.id==='sk'){S.key=$('#ky').value.trim();ls.set('key',S.key);S.items=[];toast(T('keysaved'));return}
  if(t.id==='cf'){S.favs=[];ls.set('favs',[]);toast(T('favclr'));return}
  if(t.id==='ch'){S.hist=[];ls.set('hist',[]);toast(T('histclr'))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')doSearch(e.target.value.trim())});
$('#main').addEventListener('scroll',e=>{
  const m=e.target;if(S.tab==='home'&&m.scrollTop+m.clientHeight>m.scrollHeight-500)load();
},{passive:true});

apply();render();
setTimeout(()=>{const s=$('#sp');s.style.opacity=0;setTimeout(()=>s.remove(),500)},1100);
</script>
</body>
