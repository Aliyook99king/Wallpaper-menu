name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap init "Walls Pro" com.example.wallspro --web-dir=www
      - run: npx cap add android
      - name: Custom app icon
        if: hashFiles('assets/icon-only.png') != ''
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f0f14' --iconBackgroundColorDark '#0f0f14'
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
